<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLYD · Songliste</title>
  <meta name="theme-color" content="#050505">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .toolbar { padding: 18px 28px 20px; border-bottom: 1px solid rgba(122, 157, 164, .20); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 13px; }
    .filter-button { height: 36px; padding: 0 13px; border: 1px solid rgba(105,160,169,.48); border-radius: 999px; color: #dce5e7; background: rgba(3,8,10,.72); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: .16s ease; }
    .filter-button:hover { border-color: var(--cyan); color: white; }
    .filter-button.active { border-color: var(--cyan); color: var(--black); background: var(--cyan); box-shadow: 0 0 18px rgba(64,224,208,.14); }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .search-wrap { position: relative; }
    .search-wrap input { padding-left: 43px; }
    .results-info { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .status-select { min-width: 150px; height: 36px; padding: 0 30px 0 11px; border-color: rgba(105,160,169,.48); font-size: 12px; }
    .vote.active-up { color: var(--black); background: var(--cyan); box-shadow: 0 0 14px rgba(64,224,208,.25); }
    .vote.active-down { color: white; background: var(--pink); border-color: var(--pink); box-shadow: 0 0 14px rgba(255,63,120,.22); }
    .song-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .empty-title { color: #f4f5f5; font-weight: 800; margin-bottom: 6px; }
    .empty-text { color: var(--muted); font-size: 13px; }
    @media (max-width: 650px) { .toolbar { padding: 15px; } .search-row { grid-template-columns: 1fr; } .status-select { width: 100%; min-width: 0; } .song-meta { align-items: flex-start; flex-direction: column; gap: 7px; } }
    :root {
      --black: #050505;
      --panel: rgba(8, 14, 16, 0.88);
      --panel-2: rgba(10, 18, 20, 0.94);
      --white: #f7f7f7;
      --muted: #9da8ad;
      --cyan: #40e0d0;
      --pink: #ff3f78;
      --pink-soft: #ff696d;
      --line: rgba(64, 224, 208, 0.22);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 4% 10%, rgba(64, 224, 208, 0.23), transparent 23%),
        radial-gradient(circle at 96% 12%, rgba(255, 30, 105, 0.22), transparent 24%),
        radial-gradient(circle at 0% 96%, rgba(64, 224, 208, 0.12), transparent 20%),
        radial-gradient(circle at 100% 96%, rgba(255, 30, 105, 0.14), transparent 20%),
        #050505;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: -1;
      width: 260px;
      height: 260px;
      filter: blur(80px);
      opacity: .35;
    }

    body::before {
      left: -150px;
      top: 140px;
      background: var(--cyan);
    }

    body::after {
      right: -150px;
      top: 300px;
      background: var(--pink);
    }

    .topbar {
      position: absolute;
      top: 20px;
      right: 28px;
      color: var(--cyan);
      font-size: 25px;
      line-height: 1;
      letter-spacing: -5px;
      user-select: none;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .hero {
      text-align: center;
      padding: 4px 0 24px;
    }

    .logo {
      display: block;
      width: min(390px, 76vw);
      height: auto;
      margin: 0 auto 8px;
      filter: drop-shadow(0 0 18px rgba(64, 224, 208, .12)) drop-shadow(0 0 24px rgba(255, 63, 120, .10));
    }

    .tagline {
      margin: 0 auto;
      max-width: 820px;
      color: #e4e7e8;
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.5;
      letter-spacing: .01em;
    }

    .card {
      position: relative;
      background: linear-gradient(145deg, rgba(8, 16, 18, .94), rgba(5, 8, 9, .94));
      border: 1px solid rgba(64, 224, 208, .42);
      border-radius: 18px;
      box-shadow:
        0 0 0 1px rgba(255, 63, 120, .05),
        0 0 28px rgba(64, 224, 208, .10),
        0 0 34px rgba(255, 63, 120, .06),
        inset 0 0 30px rgba(0, 0, 0, .30);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(64,224,208,.04), transparent 38%, rgba(255,63,120,.04));
    }

    .add-card {
      padding: 25px 30px 28px;
      margin-bottom: 24px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 18px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .plus {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(64, 224, 208, .08);
      color: white;
      font-size: 29px;
      font-weight: 300;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgba(64,224,208,.18), 0 0 18px rgba(64,224,208,.08);
    }

    .section-title span:last-child {
      border-left: 2px solid var(--cyan);
      padding-left: 10px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr 1.15fr auto;
      gap: 14px;
      align-items: center;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cyan);
      font-size: 17px;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px 0 43px;
      border: 1px solid rgba(105, 160, 169, .48);
      border-radius: 9px;
      outline: none;
      color: var(--white);
      background: rgba(3, 8, 10, .72);
      font: inherit;
      transition: .18s ease;
    }

    input::placeholder { color: #8c969d; }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(64,224,208,.10), 0 0 18px rgba(64,224,208,.10);
    }

    .submit-btn {
      height: 44px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      color: #18040b;
      background: linear-gradient(135deg, #ff2e72, #ff5a86);
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(255, 63, 120, .18);
      white-space: nowrap;
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 0 30px rgba(255, 63, 120, .30);
    }

    .submit-btn:disabled { opacity: .6; cursor: wait; transform: none; }

    .status {
      min-height: 20px;
      margin-top: 10px;
      color: var(--cyan);
      font-size: 13px;
    }

    .list-card {
      border-color: rgba(64,224,208,.25);
      box-shadow: 0 0 0 1px rgba(255,63,120,.04), 0 0 28px rgba(255,63,120,.05), 0 0 28px rgba(64,224,208,.06);
    }

    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 17px 28px 14px;
      border-bottom: 1px solid rgba(122, 157, 164, .20);
    }

    .list-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .music-note {
      color: var(--pink);
      font-size: 30px;
      line-height: 1;
    }

    select {
      height: 42px;
      min-width: 170px;
      padding: 0 37px 0 16px;
      border: 1px solid var(--cyan);
      border-radius: 999px;
      outline: none;
      color: white;
      background: rgba(3, 10, 12, .90);
      font: inherit;
      cursor: pointer;
    }

    .songs { padding: 0 28px; }

    .song {
      display: grid;
      grid-template-columns: 64px 54px 1fr auto;
      align-items: center;
      gap: 13px;
      min-height: 76px;
      border-bottom: 1px solid rgba(122, 157, 164, .19);
    }

    .song:last-child { border-bottom: 0; }

    .votes {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .vote {
      width: 44px;
      height: 25px;
      padding: 0;
      border: 1px solid rgba(64,224,208,.85);
      border-radius: 999px;
      color: #e7ffff;
      background: rgba(64,224,208,.03);
      font-size: 12px;
      cursor: pointer;
      transition: .16s ease;
    }

    .vote:hover:not(:disabled) {
      color: var(--black);
      background: var(--cyan);
      box-shadow: 0 0 14px rgba(64,224,208,.25);
    }

    .vote:disabled { opacity: .5; cursor: wait; }

    .count {
      color: var(--cyan);
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      line-height: 1;
    }

    .song-main { min-width: 0; }

    .song-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      color: #f4f5f5;
      font-size: 15px;
      font-weight: 700;
    }

    .artist {
      margin-top: 2px;
      color: #98a6ac;
      font-size: 13px;
    }

    .new {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border: 1px solid var(--cyan);
      border-radius: 999px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .listen {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 126px;
      height: 38px;
      padding: 0 15px;
      border: 1px solid var(--pink);
      border-radius: 999px;
      color: #f5f5f5;
      background: transparent;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: .16s ease;
    }

    .listen::first-letter { color: var(--pink); }

    .listen:hover {
      color: white;
      background: rgba(255,63,120,.10);
      box-shadow: 0 0 18px rgba(255,63,120,.16);
      transform: translateY(-1px);
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      padding: 28px 0 0;
      text-align: center;
      color: #a8afb3;
      font-size: 12px;
      letter-spacing: .15em;
    }

    @media (max-width: 900px) {
      form { grid-template-columns: 1fr 1fr; }
      .submit-btn { width: 100%; grid-column: 1 / -1; }
      .song { grid-template-columns: 56px 48px 1fr auto; }
    }

    @media (max-width: 650px) {
      .page { width: min(100% - 18px, 1120px); padding-top: 20px; }
      .topbar { top: 13px; right: 15px; font-size: 21px; }
      .hero { padding-bottom: 16px; }
      .logo { width: min(310px, 78vw); }
      .tagline { padding: 0 8px; font-size: 13px; }
      .add-card { padding: 18px 15px 20px; border-radius: 14px; }
      form { grid-template-columns: 1fr; gap: 10px; }
      .submit-btn { grid-column: auto; }
      .list-head { align-items: stretch; flex-direction: column; padding: 15px; }
      select { width: 100%; }
      .songs { padding: 0 13px; }
      .song { grid-template-columns: 48px 42px 1fr; gap: 8px; min-height: 72px; padding: 7px 0; }
      .listen { grid-column: 3; justify-self: start; min-width: 112px; height: 34px; margin-top: 2px; }
      .count { font-size: 19px; }
      .vote { width: 38px; height: 23px; }
      .song-title { font-size: 14px; }
      .artist { font-size: 12px; }
      footer { padding-bottom: 10px; }
    }
  </style>
</head>

<body>
  <div class="topbar">☰</div>

  <main class="page">
    <header class="hero">
      <img class="logo" src="flyd-logo.png" alt="FLYD">
      <p class="tagline">Songs vorschlagen, gemeinsam abstimmen und die nächste Setlist vorbereiten. 🎸</p>
    </header>

    <section class="card add-card">
      <h2 class="section-title">
        <span class="plus">+</span>
        <span>Song hinzufügen</span>
      </h2>

      <form id="songForm">
        <div class="input-wrap">
          <span class="input-icon">♫</span>
          <input id="title" type="text" placeholder="Songtitel" required maxlength="120">
        </div>

        <div class="input-wrap">
          <span class="input-icon">♙</span>
          <input id="artist" type="text" placeholder="Interpret / Band" required maxlength="120">
        </div>

        <div class="input-wrap">
          <span class="input-icon">↗</span>
          <input id="url" type="url" placeholder="Spotify- oder YouTube-Link (optional)" maxlength="500">
        </div>

        <button class="submit-btn" type="submit">＋ &nbsp; Song hinzufügen</button>
      </form>

      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section class="card list-card">
      <div class="list-head">
        <h2 class="list-title"><span class="music-note">♫</span> Songliste</h2>
        <select id="sort" aria-label="Songs sortieren">
          <option value="new" selected>Neue zuerst</option>
          <option value="votes">Nach Stimmen</option>
          <option value="title">Nach Titel</option>
        </select>
      </div>

      <div class="toolbar">
        <div class="filters" id="filters" aria-label="Songstatus filtern">
          <button class="filter-button active" type="button" data-filter="all">Alle</button>
          <button class="filter-button" type="button" data-filter="suggestion">💡 Vorschläge</button>
          <button class="filter-button" type="button" data-filter="practice">🛠️ Üben</button>
          <button class="filter-button" type="button" data-filter="repertoire">🎸 Repertoire</button>
          <button class="filter-button" type="button" data-filter="archive">🗄️ Archiv</button>
        </div>

        <div class="search-row">
          <div class="input-wrap search-wrap">
            <span class="input-icon">🔎</span>
            <input id="search" type="search" placeholder="In allen Songs suchen …" autocomplete="off" maxlength="120">
          </div>
        </div>

        <div id="resultsInfo" class="results-info" aria-live="polite"></div>
      </div>

      <div id="songs" class="songs"></div>
    </section>

    <footer>FLYD · Music. Together.</footer>
  </main>

  <script>
    // Der anon/public Key darf im Frontend stehen. Niemals den service_role-Key verwenden.
    const SUPABASE_URL = "https://likbfaaucgnxtelesftw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxpa2JmYWF1Y2dueHRlbGVzZnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MDQ2MjMsImV4cCI6MjEwNTM4MDYyM30.ATnzNZueP8sr57juyNIx_ce_7gKwqhk8ukzXtXKFXZc";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("songForm");
    const songsElement = document.getElementById("songs");
    const statusElement = document.getElementById("status");
    const sortElement = document.getElementById("sort");
    const searchElement = document.getElementById("search");
    const filtersElement = document.getElementById("filters");
    const resultsInfoElement = document.getElementById("resultsInfo");
    const submitButton = form.querySelector("button[type='submit']");

    const STATUS_OPTIONS = {
      suggestion: "💡 Vorschlag",
      practice: "🛠️ Üben",
      repertoire: "🎸 Repertoire",
      archive: "🗄️ Archiv"
    };

    const FILTER_LABELS = {
      all: "Alle",
      suggestion: "💡 Vorschläge",
      practice: "🛠️ Üben",
      repertoire: "🎸 Repertoire",
      archive: "🗄️ Archiv"
    };

    let songs = [];
    let votes = [];
    let currentFilter = "all";
    let searchTerm = "";

    function getVoterId() {
      const storageKey = "flyd-voter-id";
      let voterId = localStorage.getItem(storageKey);

      if (!voterId) {
        voterId = crypto.randomUUID();
        localStorage.setItem(storageKey, voterId);
      }

      return voterId;
    }

    const voterId = getVoterId();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }

    function isNew(createdAt) {
      return Date.now() - new Date(createdAt).getTime() < 7 * 24 * 60 * 60 * 1000;
    }

    function getVoteInfo(songId) {
      const songVotes = votes.filter(vote => vote.song_id === songId);
      const score = songVotes.reduce((sum, vote) => sum + Number(vote.vote), 0);
      const myVote = songVotes.find(vote => vote.voter_id === voterId);

      return {
        score,
        mine: myVote ? Number(myVote.vote) : 0
      };
    }

    function getCurrentFilterLabel() {
      return FILTER_LABELS[currentFilter] || "Alle";
    }

    function updateSearchPlaceholder() {
      const placeholders = {
        all: "In allen Songs suchen …",
        suggestion: "In den Vorschlägen suchen …",
        practice: "In „Üben“ suchen …",
        repertoire: "Im Repertoire suchen …",
        archive: "Im Archiv suchen …"
      };

      searchElement.placeholder = placeholders[currentFilter] || placeholders.all;
    }

    function updateFilterButtons() {
      filtersElement.querySelectorAll(".filter-button").forEach(button => {
        button.classList.toggle("active", button.dataset.filter === currentFilter);
      });
    }

    function matchesSearch(song) {
      if (!searchTerm) return true;

      const haystack = `${song.title || ""} ${song.artist || ""}`.toLocaleLowerCase("de-DE");
      return haystack.includes(searchTerm);
    }

    function getVisibleSongs() {
      let list = songs.filter(song => {
        const statusMatches = currentFilter === "all" || song.status === currentFilter;
        return statusMatches && matchesSearch(song);
      });

      if (sortElement.value === "new") {
        list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      } else if (sortElement.value === "votes") {
        list.sort((a, b) => {
          const voteDifference = getVoteInfo(b.id).score - getVoteInfo(a.id).score;
          if (voteDifference !== 0) return voteDifference;
          return new Date(b.created_at) - new Date(a.created_at);
        });
      } else if (sortElement.value === "title") {
        list.sort((a, b) => a.title.localeCompare(b.title, "de"));
      }

      return list;
    }

    function renderEmptyState() {
      if (songs.length === 0) {
        songsElement.innerHTML = `
          <div class="empty">
            <div class="empty-title">🎸 Noch keine Songs</div>
            <div class="empty-text">Schlag den ersten Song für FLYD vor!</div>
          </div>
        `;
        return;
      }

      const filterText = currentFilter !== "all"
        ? ` in ${getCurrentFilterLabel()}`
        : "";

      songsElement.innerHTML = `
        <div class="empty">
          <div class="empty-title">🔎 Keine Songs gefunden</div>
          <div class="empty-text">
            ${searchTerm
              ? `Für „${escapeHTML(searchTerm)}“${filterText} wurde nichts gefunden.`
              : `In diesem Bereich sind gerade keine Songs.`
            }
          </div>
        </div>
      `;
    }

    function renderSongs() {
      const list = getVisibleSongs();

      resultsInfoElement.textContent =
        `${getCurrentFilterLabel()} · ${list.length} ${list.length === 1 ? "Song" : "Songs"} gefunden`;

      if (list.length === 0) {
        renderEmptyState();
        return;
      }

      songsElement.innerHTML = list.map(song => {
        const voteInfo = getVoteInfo(song.id);
        const status = song.status || "suggestion";

        return `
          <div class="song">
            <div class="votes">
              <button
                class="vote ${voteInfo.mine === 1 ? "active-up" : ""}"
                data-id="${escapeHTML(song.id)}"
                data-vote="1"
                aria-label="Für ${escapeHTML(song.title)} stimmen"
                title="Hochvoten"
              >▲</button>

              <div class="count">${voteInfo.score}</div>

              <button
                class="vote ${voteInfo.mine === -1 ? "active-down" : ""}"
                data-id="${escapeHTML(song.id)}"
                data-vote="-1"
                aria-label="Gegen ${escapeHTML(song.title)} stimmen"
                title="Runtervoten"
              >▼</button>
            </div>

            <div class="song-main">
              <div class="song-title">
                ${escapeHTML(song.title)}
                ${isNew(song.created_at) ? `<span class="new">NEU</span>` : ""}
              </div>
              <div class="artist">${escapeHTML(song.artist)}</div>
            </div>

            <select class="status-select" data-status-id="${escapeHTML(song.id)}" aria-label="Status für ${escapeHTML(song.title)}">
              ${Object.entries(STATUS_OPTIONS).map(([value, label]) =>
                `<option value="${value}" ${status === value ? "selected" : ""}>${label}</option>`
              ).join("")}
            </select>

            ${song.url ? `
              <a class="listen" href="${escapeHTML(song.url)}" target="_blank" rel="noopener noreferrer">
                ▶ &nbsp; Anhören
              </a>
            ` : `<span></span>`}
          </div>
        `;
      }).join("");
    }

    async function loadSongs() {
      const { data, error } = await db
        .from("songs")
        .select("id,title,artist,url,votes,status,created_at");

      if (error) {
        console.error(error);
        statusElement.textContent = "❌ " + error.message + " (" + (error.code || "unbekannt") + ")";
        return;
      }

      songs = (data || []).map(song => ({
        ...song,
        status: song.status || "suggestion"
      }));

      statusElement.textContent = "";
      renderSongs();
    }

    async function loadVotes() {
      const { data, error } = await db
        .from("song_votes")
        .select("song_id,voter_id,vote");

      if (error) {
        console.error(error);
        statusElement.textContent = "❌ Abstimmungen konnten nicht geladen werden: " + error.message;
        return;
      }

      votes = data || [];
      renderSongs();
    }

    async function handleVote(songId, requestedVote) {
      const current = votes.find(vote => vote.song_id === songId && vote.voter_id === voterId);

      // Gleicher Button = eigene Stimme zurücknehmen.
      if (current && Number(current.vote) === requestedVote) {
        const { error } = await db
          .from("song_votes")
          .delete()
          .eq("song_id", songId)
          .eq("voter_id", voterId);

        if (error) {
          console.error(error);
          statusElement.textContent = "❌ Stimme konnte nicht entfernt werden: " + error.message;
          return;
        }
      } else {
        const { error } = await db
          .from("song_votes")
          .upsert(
            { song_id: songId, voter_id: voterId, vote: requestedVote },
            { onConflict: "song_id,voter_id" }
          );

        if (error) {
          console.error(error);
          statusElement.textContent = "❌ Stimme konnte nicht gespeichert werden: " + error.message;
          return;
        }
      }

      statusElement.textContent = "";
      await loadVotes();
    }

    async function handleStatusChange(songId, newStatus) {
      if (!STATUS_OPTIONS[newStatus]) return;

      const { error } = await db
        .from("songs")
        .update({ status: newStatus })
        .eq("id", songId);

      if (error) {
        console.error(error);
        statusElement.textContent = "❌ Status konnte nicht geändert werden: " + error.message;
        renderSongs();
        return;
      }

      const song = songs.find(item => item.id === songId);
      if (song) song.status = newStatus;

      statusElement.textContent = "";
      renderSongs();
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const title = document.getElementById("title").value.trim();
      const artist = document.getElementById("artist").value.trim();
      const url = document.getElementById("url").value.trim();

      if (!title || !artist) return;

      submitButton.disabled = true;
      statusElement.textContent = "Song wird hinzugefügt…";

      const { error } = await db
        .from("songs")
        .insert({
          title,
          artist,
          url: url || null,
          votes: 0,
          status: "suggestion"
        });

      submitButton.disabled = false;

      if (error) {
        console.error(error);
        statusElement.textContent = "❌ Song konnte nicht hinzugefügt werden: " + error.message;
        return;
      }

      form.reset();
      statusElement.textContent = "✅ Song wurde hinzugefügt.";
      await loadSongs();
    });

    sortElement.addEventListener("change", renderSongs);

    searchElement.addEventListener("input", event => {
      searchTerm = event.target.value.trim().toLocaleLowerCase("de-DE");
      renderSongs();
    });

    filtersElement.addEventListener("click", event => {
      const button = event.target.closest(".filter-button");
      if (!button) return;

      currentFilter = button.dataset.filter;
      updateFilterButtons();
      updateSearchPlaceholder();
      renderSongs();
    });

    songsElement.addEventListener("click", async event => {
      const voteButton = event.target.closest(".vote");
      if (!voteButton) return;

      const songId = voteButton.dataset.id;
      const requestedVote = Number(voteButton.dataset.vote);

      voteButton.disabled = true;
      await handleVote(songId, requestedVote);
      voteButton.disabled = false;
    });

    songsElement.addEventListener("change", async event => {
      const statusSelect = event.target.closest(".status-select");
      if (!statusSelect) return;

      const songId = statusSelect.dataset.statusId;
      const newStatus = statusSelect.value;

      statusSelect.disabled = true;
      await handleStatusChange(songId, newStatus);
      statusSelect.disabled = false;
    });

    // Realtime: Änderungen an Songs und Stimmen erscheinen automatisch.
    db.channel("flyd-realtime")
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "songs" },
        () => loadSongs()
      )
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "song_votes" },
        () => loadVotes()
      )
      .subscribe();

    updateFilterButtons();
    updateSearchPlaceholder();
    loadSongs();
    loadVotes();
  </script>
</body>
</html>
