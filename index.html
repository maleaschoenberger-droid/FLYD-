<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FLYD — Music. Together.</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --black: #050505;
      --black-2: #090909;
      --card: #101010;
      --card-2: #151515;

      --white: #f7f7f7;
      --muted: #888;

      --pink: #ff696d;
      --pink-dark: #c8444b;

      --cyan: #40e0d0;
      --cyan-dark: #1caea2;

      --border: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 8% 15%,
          rgba(64, 224, 208, 0.13),
          transparent 28%
        ),
        radial-gradient(
          circle at 92% 20%,
          rgba(255, 105, 109, 0.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(255,255,255,0.025),
          transparent 35%
        ),
        var(--black);

      color: var(--white);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow-x: hidden;
    }

    /* --------------------------------
       BACKGROUND
    -------------------------------- */

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          rgba(255,255,255,0.012) 1px,
          transparent 1px
        );

      background-size: 100% 4px;

      opacity: 0.25;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;

      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;

      padding: 24px 0 50px;
    }

    /* --------------------------------
       TOP BAR
    -------------------------------- */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .topline {
      width: 90px;
      height: 3px;

      background: var(--cyan);

      box-shadow:
        0 0 14px rgba(64,224,208,0.8);

      transform: skewX(-25deg);
    }

    .menu-icon {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;

      color: var(--white);

      font-size: 17px;

      background: rgba(255,255,255,0.025);
    }

    /* --------------------------------
       HERO
    -------------------------------- */

    .hero {
      position: relative;

      text-align: center;

      padding: 25px 0 55px;
    }

    .hero-kicker {
      margin-bottom: 8px;

      color: var(--cyan);

      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.38em;

      text-transform: uppercase;
    }

    .logo {
      position: relative;

      display: inline-block;

      margin: 0;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

      font-size: clamp(82px, 16vw, 190px);
      line-height: 0.78;

      font-weight: 900;
      letter-spacing: -0.075em;

      color: #fff;

      transform: skewX(-8deg);

      text-transform: uppercase;

      text-shadow:
        7px 7px 0 var(--cyan),
        -5px -4px 0 rgba(255,105,109,0.8),
        0 0 45px rgba(255,255,255,0.08);
    }

    .logo span {
      color: var(--pink);

      text-shadow:
        7px 7px 0 var(--cyan),
        -4px -3px 0 #fff,
        0 0 40px rgba(255,105,109,0.35);
    }

    .logo::after {
      content: "FLYD";

      position: absolute;

      left: 4px;
      top: 8px;

      z-index: -1;

      color: transparent;

      -webkit-text-stroke: 1px rgba(255,255,255,0.16);

      transform: translate(13px, 13px);

      pointer-events: none;
    }

    .hero-subtitle {
      max-width: 680px;

      margin: 28px auto 0;

      color: #b8b8b8;

      font-size: 15px;
      line-height: 1.6;

      letter-spacing: 0.02em;
    }

    .hero-subtitle strong {
      color: white;
    }

    .hero-line {
      width: min(480px, 70%);

      height: 1px;

      margin: 32px auto 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          var(--pink),
          transparent
        );

      box-shadow:
        0 0 18px rgba(64,224,208,0.35);
    }

    /* --------------------------------
       CARDS
    -------------------------------- */

    .card {
      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.045),
          rgba(255,255,255,0.012)
        );

      border: 1px solid var(--border);

      border-radius: 20px;

      box-shadow:
        0 25px 80px rgba(0,0,0,0.45);

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          transparent 35%,
          transparent 65%,
          var(--pink)
        );

      opacity: 0.9;
    }

    /* --------------------------------
       ADD SONG
    -------------------------------- */

    .add-card {
      padding: 30px;
      margin-bottom: 28px;
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 22px;
    }

    .section-title {
      margin: 0;

      font-size: 18px;
      font-weight: 900;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    .section-title::before {
      content: "+";

      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 27px;
      height: 27px;

      margin-right: 10px;

      color: var(--black);
      background: var(--cyan);

      border-radius: 6px;

      box-shadow:
        0 0 18px rgba(64,224,208,0.45);

      font-size: 20px;
    }

    .section-note {
      color: #666;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    .song-form {
      display: grid;

      grid-template-columns:
        1fr
        1fr
        1.15fr
        auto;

      gap: 10px;
    }

    .input-wrap {
      position: relative;
    }

    .song-form input {
      width: 100%;

      padding: 15px 16px;

      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;

      background: rgba(0,0,0,0.45);

      color: white;

      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }

    .song-form input::placeholder {
      color: #5f5f5f;
    }

    .song-form input:focus {
      border-color: var(--cyan);

      background: rgba(0,0,0,0.7);

      box-shadow:
        0 0 0 2px rgba(64,224,208,0.08),
        0 0 20px rgba(64,224,208,0.08);
    }

    .submit-button {
      position: relative;

      border: 0;
      border-radius: 10px;

      padding: 0 23px;

      background:
        linear-gradient(
          135deg,
          #ff7c80,
          var(--pink-dark)
        );

      color: white;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      cursor: pointer;

      box-shadow:
        0 8px 30px rgba(255,105,109,0.2);

      transition:
        transform 0.18s,
        box-shadow 0.18s,
        filter 0.18s;
    }

    .submit-button:hover {
      transform: translateY(-2px);

      filter: brightness(1.08);

      box-shadow:
        0 12px 40px rgba(255,105,109,0.35);
    }

    .submit-button:active {
      transform: translateY(0);
    }

    /* --------------------------------
       SONG LIST HEADER
    -------------------------------- */

    .list-card {
      padding: 30px;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 20px;
    }

    .list-title {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .list-title h2 {
      margin: 0;

      font-size: 18px;
      font-weight: 900;

      letter-spacing: 0.1em;

      text-transform: uppercase;
    }

    .list-title .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--pink);

      box-shadow:
        0 0 15px var(--pink);
    }

    .sort-area {
      display: flex;
      align-items: center;

      gap: 9px;
    }

    .sort-label {
      color: #666;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 0.1em;

      text-transform: uppercase;
    }

    .sort-select {
      appearance: none;

      padding: 9px 30px 9px 12px;

      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;

      background:
        linear-gradient(45deg, transparent 50%, #777 50%) calc(100% - 14px) 50% / 5px 5px no-repeat,
        #0a0a0a;

      color: #ddd;

      font-size: 11px;

      outline: none;

      cursor: pointer;
    }

    .sort-select:focus {
      border-color: var(--cyan);
    }

    /* --------------------------------
       STATUS
    -------------------------------- */

    #status {
      min-height: 18px;

      margin: 4px 0 14px;

      color: var(--cyan);

      font-size: 12px;
      font-weight: 700;
    }

    /* --------------------------------
       SONG LIST
    -------------------------------- */

    #songs {
      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .song {
      position: relative;

      display: grid;

      grid-template-columns:
        60px
        minmax(0, 1fr)
        auto;

      align-items: center;

      min-height: 76px;

      padding: 10px 14px 10px 10px;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035),
          rgba(255,255,255,0.012)
        );

      border: 1px solid rgba(255,255,255,0.055);

      border-radius: 12px;

      transition:
        transform 0.18s,
        border-color 0.18s,
        background 0.18s;
    }

    .song:hover {
      transform: translateX(4px);

      border-color: rgba(64,224,208,0.25);

      background:
        linear-gradient(
          90deg,
          rgba(64,224,208,0.055),
          rgba(255,255,255,0.015)
        );
    }

    .song::before {
      content: "";

      position: absolute;

      left: 0;
      top: 15px;
      bottom: 15px;

      width: 2px;

      background: var(--cyan);

      opacity: 0;

      transition: opacity 0.18s;
    }

    .song:hover::before {
      opacity: 1;
    }

    /* --------------------------------
       VOTING
    -------------------------------- */

    .votes {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 2px;
    }

    .vote {
      width: 30px;
      height: 22px;

      padding: 0;

      border: 0;
      border-radius: 5px;

      background: transparent;

      color: #555;

      font-size: 13px;

      cursor: pointer;

      transition:
        background 0.15s,
        color 0.15s,
        transform 0.15s;
    }

    .vote:hover {
      background: rgba(64,224,208,0.12);

      color: var(--cyan);

      transform: scale(1.08);
    }

    .vote:disabled {
      opacity: 0.4;
      cursor: wait;
    }

    .count {
      min-width: 34px;

      text-align: center;

      color: var(--cyan);

      font-size: 16px;
      font-weight: 900;

      text-shadow:
        0 0 12px rgba(64,224,208,0.3);
    }

    /* --------------------------------
       SONG INFO
    -------------------------------- */

    .title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 9px;

      color: white;

      font-size: 16px;
      font-weight: 850;

      letter-spacing: 0.01em;
    }

    .artist {
      margin-top: 5px;

      color: #777;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.02em;
    }

    .new {
      display: inline-flex;
      align-items: center;

      padding: 4px 7px;

      border-radius: 4px;

      background: var(--cyan);

      color: #001513;

      font-size: 8px;
      font-weight: 1000;

      letter-spacing: 0.1em;

      box-shadow:
        0 0 14px rgba(64,224,208,0.25);
    }

    /* --------------------------------
       LISTEN BUTTON
    -------------------------------- */

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    .listen {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 105px;

      padding: 9px 13px;

      border: 1px solid rgba(255,105,109,0.45);
      border-radius: 7px;

      background: rgba(255,105,109,0.025);

      color: #ff8588;

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 0.08em;

      text-decoration: none;
      text-transform: uppercase;

      transition:
        background 0.18s,
        border-color 0.18s,
        color 0.18s,
        box-shadow 0.18s;
    }

    .listen:hover {
      background: var(--pink);

      border-color: var(--pink);

      color: white;

      box-shadow:
        0 0 25px rgba(255,105,109,0.25);
    }

    /* --------------------------------
       EMPTY
    -------------------------------- */

    .empty {
      padding: 50px 20px;

      text-align: center;

      color: #666;

      font-size: 14px;
    }

    /* --------------------------------
       FOOTER
    -------------------------------- */

    footer {
      padding: 45px 0 10px;

      text-align: center;

      color: #444;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 0.22em;

      text-transform: uppercase;
    }

    footer span {
      color: var(--pink);
    }

    /* --------------------------------
       MOBILE
    -------------------------------- */

    @media (max-width: 850px) {

      .page {
        width: min(100% - 22px, 700px);

        padding-top: 15px;
      }

      .hero {
        padding: 35px 0 40px;
      }

      .hero-kicker {
        font-size: 9px;
      }

      .logo {
        font-size: clamp(76px, 24vw, 145px);
      }

      .hero-subtitle {
        font-size: 13px;

        padding: 0 15px;
      }

      .add-card,
      .list-card {
        padding: 20px;
      }

      .song-form {
        grid-template-columns: 1fr 1fr;
      }

      .song-form .input-wrap:nth-child(3) {
        grid-column: 1 / -1;
      }

      .submit-button {
        min-height: 48px;
      }
    }

    @media (max-width: 600px) {

      .topline {
        width: 55px;
      }

      .hero {
        padding-top: 25px;
      }

      .logo {
        font-size: 25vw;

        text-shadow:
          5px 5px 0 var(--cyan),
          -3px -3px 0 rgba(255,105,109,0.8);
      }

      .hero-subtitle {
        margin-top: 22px;
      }

      .hero-line {
        margin-top: 25px;
      }

      .section-heading {
        align-items: flex-start;

        flex-direction: column;

        gap: 7px;
      }

      .section-note {
        padding-left: 37px;
      }

      .song-form {
        grid-template-columns: 1fr;
      }

      .song-form .input-wrap:nth-child(3) {
        grid-column: auto;
      }

      .submit-button {
        width: 100%;

        min-height: 50px;
      }

      .list-header {
        align-items: flex-start;

        flex-direction: column;

        gap: 13px;
      }

      .sort-area {
        width: 100%;

        justify-content: space-between;
      }

      .sort-select {
        flex: 1;

        max-width: 200px;
      }

      .song {
        grid-template-columns:
          48px
          minmax(0, 1fr)
          auto;

        min-height: 70px;

        padding-right: 8px;
      }

      .title {
        font-size: 14px;
      }

      .artist {
        font-size: 11px;
      }

      .listen {
        min-width: auto;

        padding: 8px 9px;

        font-size: 9px;
      }
    }

    @media (max-width: 430px) {

      .page {
        width: calc(100% - 16px);
      }

      .add-card,
      .list-card {
        padding: 16px;
      }

      .song {
        grid-template-columns:
          43px
          minmax(0, 1fr);

        padding: 9px;
      }

      .actions {
        grid-column: 2;

        justify-content: flex-start;

        margin-top: 8px;
      }

      .listen {
        width: 100%;

        min-width: 0;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- TOP -->
    <div class="topbar">
      <div class="topline"></div>
      <div class="menu-icon">≡</div>
    </div>

    <!-- HERO -->
    <header class="hero">

      <div class="hero-kicker">
        FLYD BAND · SONG SYSTEM
      </div>

      <h1 class="logo">
        FLY<span>D</span>
      </h1>

      <p class="hero-subtitle">
        <strong>Songs vorschlagen.</strong>
        Gemeinsam abstimmen.
        Die nächste Setlist vorbereiten. 🎸
      </p>

      <div class="hero-line"></div>

    </header>


    <!-- SONG HINZUFÜGEN -->
    <section class="card add-card">

      <div class="section-heading">

        <h2 class="section-title">
          Song hinzufügen
        </h2>

        <div class="section-note">
          Bring your next idea
        </div>

      </div>

      <form id="songForm" class="song-form">

        <div class="input-wrap">
          <input
            id="title"
            type="text"
            placeholder="Songtitel"
            autocomplete="off"
            required
          >
        </div>

        <div class="input-wrap">
          <input
            id="artist"
            type="text"
            placeholder="Interpret / Band"
            autocomplete="off"
            required
          >
        </div>

        <div class="input-wrap">
          <input
            id="url"
            type="url"
            placeholder="YouTube / Spotify Link (optional)"
            autocomplete="off"
          >
        </div>

        <button
          class="submit-button"
          type="submit"
        >
          Song hinzufügen
        </button>

      </form>

    </section>


    <!-- SONG LIST -->
    <section class="card list-card">

      <div class="list-header">

        <div class="list-title">

          <div class="dot"></div>

          <h2>Songliste</h2>

        </div>

        <div class="sort-area">

          <span class="sort-label">
            Sortieren
          </span>

          <select
            id="sort"
            class="sort-select"
          >
            <option value="new">
              Neueste zuerst
            </option>

            <option value="votes">
              Nach Stimmen
            </option>

            <option value="title">
              Titel A–Z
            </option>
          </select>

        </div>

      </div>

      <div id="status"></div>

      <div id="songs"></div>

    </section>


    <footer>
      FLYD <span>·</span> Music. Together.
    </footer>

  </main>


  <script>
    /*
      ========================================
      SUPABASE
      ========================================
    */

    const SUPABASE_URL =
      "https://likbfaaucgnxtelesftw.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF1c2UiLCJyZWYiOiJsaWtiZmFhdWNnbnh0ZWxlc2Z0dyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg5ODA0NjIzLCJleHAiOjIxMDUzODA2MjN9.ATnzNZueP8sr57juyNI_xce_7gKwqhk8ukzXtXKFXZc";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
      ========================================
      ELEMENTS
      ========================================
    */

    const form =
      document.getElementById("songForm");

    const songsElement =
      document.getElementById("songs");

    const statusElement =
      document.getElementById("status");

    const sortElement =
      document.getElementById("sort");


    /*
      ========================================
      STATE
      ========================================
    */

    let songs = [];


    /*
      ========================================
      SECURITY
      ========================================
    */

    function escapeHTML(value) {

      return String(value ?? "").replace(
        /[&<>"']/g,

        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character])
      );
    }


    /*
      ========================================
      NEW SONG
      ========================================
    */

    function isNew(createdAt) {

      return (
        Date.now() -
        new Date(createdAt).getTime()
      ) < 7 * 24 * 60 * 60 * 1000;
    }


    /*
      ========================================
      RENDER
      ========================================
    */

    function renderSongs() {

      let list = [...songs];


      /*
        STANDARD:
        NEUE SONGS ZUERST

        Bei gleichem Erstellungszeitpunkt
        werden mehr Stimmen bevorzugt.
      */

      if (sortElement.value === "new") {

        list.sort((a, b) => {

          const dateDifference =
            new Date(b.created_at) -
            new Date(a.created_at);

          if (dateDifference !== 0) {
            return dateDifference;
          }

          return (
            (b.votes || 0) -
            (a.votes || 0)
          );
        });

      }


      /*
        NACH STIMMEN
      */

      else if (sortElement.value === "votes") {

        list.sort((a, b) => {

          const voteDifference =
            (b.votes || 0) -
            (a.votes || 0);

          if (voteDifference !== 0) {
            return voteDifference;
          }

          return (
            new Date(b.created_at) -
            new Date(a.created_at)
          );
        });

      }


      /*
        TITEL
      */

      else if (sortElement.value === "title") {

        list.sort((a, b) =>
          a.title.localeCompare(
            b.title,
            "de"
          )
        );
      }


      /*
        LEER
      */

      if (list.length === 0) {

        songsElement.innerHTML = `
          <div class="empty">
            Noch keine Songs vorhanden 🎶
          </div>
        `;

        return;
      }


      /*
        SONGS
      */

      songsElement.innerHTML = list.map(song => `

        <div class="song">

          <div class="votes">

            <button
              class="vote"
              data-id="${escapeHTML(song.id)}"
              data-vote="1"
              title="Dafür stimmen"
            >
              ▲
            </button>

            <div class="count">
              ${song.votes || 0}
            </div>

            <button
              class="vote"
              data-id="${escapeHTML(song.id)}"
              data-vote="-1"
              title="Dagegen stimmen"
            >
              ▼
            </button>

          </div>


          <div>

            <div class="title">

              ${escapeHTML(song.title)}

              ${
                isNew(song.created_at)
                  ? `<span class="new">NEU</span>`
                  : ""
              }

            </div>

            <div class="artist">
              ${escapeHTML(song.artist)}
            </div>

          </div>


          <div class="actions">

            ${
              song.url
                ? `
                  <a
                    class="listen"
                    href="${escapeHTML(song.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ▶ Anhören
                  </a>
                `
                : ""
            }

          </div>

        </div>

      `).join("");
    }


    /*
      ========================================
      LOAD SONGS
      ========================================
    */

    async function loadSongs() {

      const {
        data,
        error
      } = await db
        .from("songs")
        .select(
          "id,title,artist,url,votes,created_at"
        );

      if (error) {

        console.error(error);

        statusElement.textContent =
          "❌ " +
          error.message +
          " (" +
          error.code +
          ")";

        return;
      }

      songs = data || [];

      statusElement.textContent = "";

      renderSongs();
    }


    /*
      ========================================
      ADD SONG
      ========================================
    */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const title =
          document
            .getElementById("title")
            .value
            .trim();


        const artist =
          document
            .getElementById("artist")
            .value
            .trim();


        const url =
          document
            .getElementById("url")
            .value
            .trim();


        if (!title || !artist) {
          return;
        }


        statusElement.textContent =
          "Song wird hinzugefügt…";


        const {
          error
        } = await db
          .from("songs")
          .insert({

            title: title,

            artist: artist,

            url: url || null,

            votes: 0

          });


        if (error) {

          console.error(error);

          statusElement.textContent =
            "❌ Song konnte nicht hinzugefügt werden.";

          return;
        }


        form.reset();


        statusElement.textContent =
          "✅ Song hinzugefügt!";


        await loadSongs();


        setTimeout(() => {

          statusElement.textContent = "";

        }, 2000);

      }
    );


    /*
      ========================================
      VOTING
      ========================================
    */

    songsElement.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest("[data-vote]");


        if (!button) {
          return;
        }


        const id =
          button.dataset.id;


        const change =
          Number(button.dataset.vote);


        const song =
          songs.find(
            item => item.id === id
          );


        if (!song) {
          return;
        }


        button.disabled = true;


        const newVotes =
          Math.max(
            0,
            (song.votes || 0) + change
          );


        const {
          error
        } = await db
          .from("songs")
          .update({
            votes: newVotes
          })
          .eq("id", id);


        button.disabled = false;


        if (error) {

          console.error(error);

          statusElement.textContent =
            "❌ Abstimmung fehlgeschlagen.";

          return;
        }


        await loadSongs();

      }
    );


    /*
      ========================================
      SORTING
      ========================================
    */

    sortElement.addEventListener(
      "change",
      renderSongs
    );


    /*
      ========================================
      REALTIME
      ========================================
    */

    db
      .channel("songs-live")

      .on(
        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "songs"
        },

        () => loadSongs()
      )

      .subscribe();


    /*
      ========================================
      START
      ========================================
    */

    loadSongs();

  </script>

</body>
</html>
