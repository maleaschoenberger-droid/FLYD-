<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎸 BandSong</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #182033;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 30px 16px 60px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #68738a;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    form {
      display: grid;
      gap: 10px;
    }

    input, select, button {
      font: inherit;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d5dae5;
    }

    button {
      background: #182033;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    .song {
      display: grid;
      grid-template-columns: 55px 1fr auto;
      gap: 15px;
      align-items: center;
      padding: 16px 0;
      border-top: 1px solid #edf0f5;
    }

    .votes {
      text-align: center;
    }

    .vote {
      padding: 5px 10px;
      background: white;
      color: #182033;
      border: 1px solid #d5dae5;
    }

    .vote:disabled {
      opacity: .5;
    }

    .count {
      font-weight: bold;
      margin: 4px;
    }

    .title {
      font-weight: bold;
      font-size: 18px;
    }

    .artist {
      color: #68738a;
      margin-top: 3px;
    }

    .new {
      background: #e5f7eb;
      color: #16743a;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 20px;
      margin-left: 7px;
    }

    .listen {
      color: #2459c5;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    .status {
      margin-top: 10px;
      color: #68738a;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .empty {
      text-align: center;
      color: #68738a;
      padding: 30px;
    }

    @media (max-width: 650px) {
      .song {
        grid-template-columns: 50px 1fr;
      }

      .actions {
        grid-column: 2;
      }

      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎸 BandSong</h1>
  <p class="subtitle">
    Songs vorschlagen, abstimmen und gemeinsam auswählen.
  </p>

  <div class="card">

    <form id="songForm">

      <input
        id="title"
        type="text"
        placeholder="Songtitel"
        required
      >

      <input
        id="artist"
        type="text"
        placeholder="Interpret / Band"
        required
      >

      <input
        id="url"
        type="url"
        placeholder="Spotify- oder YouTube-Link (optional)"
      >

      <button type="submit">
        + Song hinzufügen
      </button>

    </form>

    <div id="status" class="status"></div>

  </div>


  <div class="card">

    <div class="toolbar">

      <strong>🎵 Songliste</strong>

      <select id="sort">
        <option value="votes">Nach Stimmen</option>
        <option value="new">Neueste zuerst</option>
        <option value="title">Titel A–Z</option>
      </select>

    </div>

    <div id="songs"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://likbfaaucgnxtelesftw.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxpa2JmYWF1Y2dueHRlbGVzZnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MDQ2MjMsImV4cCI6MjEwNTM4MDYyM30.ATnzNZueP8sr57juyNIx_ce_7gKwqhk8ukzXtXKFXZc";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const form = document.getElementById("songForm");
const songsElement = document.getElementById("songs");
const statusElement = document.getElementById("status");
const sortElement = document.getElementById("sort");

let songs = [];


function escapeHTML(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character])
  );

}


function isNew(createdAt) {

  return (
    Date.now() -
    new Date(createdAt).getTime()
  ) < 7 * 24 * 60 * 60 * 1000;

}


function renderSongs() {

  let list = [...songs];


  if (sortElement.value === "new") {

    list.sort(
      (a,b) =>
        new Date(b.created_at) -
        new Date(a.created_at)
    );

  }


  else if (sortElement.value === "title") {

    list.sort(
      (a,b) =>
        a.title.localeCompare(b.title, "de")
    );

  }


  else {

    list.sort(
      (a,b) =>
        (b.votes || 0) -
        (a.votes || 0)
    );

  }


  if (list.length === 0) {

    songsElement.innerHTML =
      `<div class="empty">
        Noch keine Songs vorhanden 🎶
      </div>`;

    return;

  }


  songsElement.innerHTML = list.map(song => `

    <div class="song">

      <div class="votes">

        <button
          class="vote"
          data-id="${escapeHTML(song.id)}"
          data-vote="1"
        >
          ▲
        </button>

        <div class="count">
          ${song.votes || 0}
        </div>

        <button
          class="vote"
          data-id="${escapeHTML(song.id)}"
          data-vote="-1"
        >
          ▼
        </button>

      </div>


      <div>

        <div class="title">

          ${escapeHTML(song.title)}

          ${
            isNew(song.created_at)
              ? `<span class="new">Neu</span>`
              : ""
          }

        </div>

        <div class="artist">
          ${escapeHTML(song.artist)}
        </div>

      </div>


      <div class="actions">

        ${
          song.url
            ? `
              <a
                class="listen"
                href="${escapeHTML(song.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ▶ Anhören
              </a>
            `
            : ""
        }

      </div>

    </div>

  `).join("");

}


async function loadSongs() {

  const { data, error } =
    await db
      .from("songs")
      .select(
        "id,title,artist,url,votes,created_at"
      );

  if (error) {

    console.error(error);

    statusElement.textContent = "❌ " + error.message + " (" + error.code + ")";

    return;

  }


  songs = data || [];

  statusElement.textContent = "";

  renderSongs();

}


form.addEventListener("submit", async event => {

  event.preventDefault();


  const title =
    document.getElementById("title")
      .value.trim();

  const artist =
    document.getElementById("artist")
      .value.trim();

  const url =
    document.getElementById("url")
      .value.trim();


  if (!title || !artist) return;


  statusElement.textContent =
    "Song wird hinzugefügt…";


  const { error } =
    await db
      .from("songs")
      .insert({

        title: title,
        artist: artist,
        url: url || null,
        votes: 0

      });


  if (error) {

    console.error(error);

    statusElement.textContent =
      "❌ Song konnte nicht hinzugefügt werden.";

    return;

  }


  form.reset();

  statusElement.textContent =
    "✅ Song hinzugefügt!";

  await loadSongs();


  setTimeout(() => {

    statusElement.textContent = "";

  }, 2000);

});


songsElement.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest("[data-vote]");

    if (!button) return;


    const id = button.dataset.id;

    const change =
      Number(button.dataset.vote);


    const song =
      songs.find(item => item.id === id);

    if (!song) return;


    button.disabled = true;


    const newVotes =
      Math.max(
        0,
        (song.votes || 0) + change
      );


    const { error } =
      await db
        .from("songs")
        .update({
          votes: newVotes
        })
        .eq("id", id);


    button.disabled = false;


    if (error) {

      console.error(error);

      statusElement.textContent =
        "❌ Abstimmung fehlgeschlagen.";

      return;

    }


    await loadSongs();

  }
);


sortElement.addEventListener(
  "change",
  renderSongs
);


// Automatische Aktualisierung,
// wenn jemand anderes einen Song hinzufügt
// oder Stimmen verändert.

db
  .channel("songs-live")
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "songs"
    },
    () => loadSongs()
  )
  .subscribe();


loadSongs();

</script>

</body>
</html>
