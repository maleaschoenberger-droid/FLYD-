<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FLYD — Song Vorschläge</title>

  <style>
    :root {
      --black: #050505;
      --black-soft: #0b0b0b;
      --card: #101010;
      --card-2: #151515;

      --white: #f7f7f7;
      --muted: #8e8e8e;
      --line: #242424;

      --pink: #ff696d;
      --pink-dark: #d94d57;

      --cyan: #40e0d0;
      --cyan-dark: #24a99d;

      --shadow-pink: rgba(255, 105, 109, 0.28);
      --shadow-cyan: rgba(64, 224, 208, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--white);
      background:
        radial-gradient(
          circle at 8% 10%,
          rgba(64, 224, 208, 0.12),
          transparent 27%
        ),
        radial-gradient(
          circle at 92% 12%,
          rgba(255, 105, 109, 0.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(64, 224, 208, 0.055),
          transparent 35%
        ),
        var(--black);

      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;

      background-image:
        linear-gradient(rgba(255,255,255,0.8) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.8) 1px, transparent 1px);

      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    a {
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 10px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mini-mark {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.28em;
      color: var(--muted);
    }

    .mini-mark span {
      color: var(--cyan);
    }

    .menu-mark {
      width: 42px;
      height: 42px;

      border: 1px solid #2b2b2b;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--white);
      background: rgba(255,255,255,0.02);

      box-shadow:
        0 0 20px rgba(64, 224, 208, 0.06);
    }

    .menu-mark::before {
      content: "≡";
      font-size: 22px;
      line-height: 1;
      transform: translateY(-2px);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;

      padding: 50px 0 55px;
      text-align: center;

      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;

      width: 460px;
      height: 120px;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      background:
        radial-gradient(
          ellipse,
          rgba(64,224,208,0.13),
          transparent 70%
        );

      filter: blur(25px);
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      z-index: 1;

      margin-bottom: 10px;

      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.42em;
      text-transform: uppercase;

      color: var(--cyan);
    }

    .logo {
      position: relative;
      z-index: 1;

      margin: 0;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Black",
        sans-serif;

      font-size: clamp(86px, 15vw, 190px);
      line-height: 0.78;

      letter-spacing: -0.08em;
      text-transform: uppercase;

      color: var(--white);

      transform: skewX(-5deg);

      text-shadow:
        7px 7px 0 var(--cyan),
        14px 13px 0 rgba(255,105,109,0.85),
        0 0 40px rgba(64,224,208,0.12);
    }

    .logo span {
      color: var(--pink);

      text-shadow:
        6px 6px 0 var(--cyan),
        12px 11px 0 rgba(255,255,255,0.08),
        0 0 35px rgba(255,105,109,0.16);
    }

    .hero-line {
      width: min(620px, 80%);
      height: 1px;

      margin: 30px auto 18px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          var(--pink),
          transparent
        );

      opacity: 0.7;
    }

    .subtitle {
      position: relative;
      z-index: 1;

      max-width: 650px;
      margin: 0 auto;

      color: #bdbdbd;

      font-size: 15px;
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    .subtitle strong {
      color: var(--white);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto 80px;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          rgba(255,255,255,0.008)
        ),
        var(--card);

      border: 1px solid #242424;
      border-radius: 18px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.42);

      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          transparent 30%,
          transparent 70%,
          var(--pink)
        );

      opacity: 0.9;
    }

    /* =========================
       ADD SONG
    ========================= */

    .add-card {
      margin-bottom: 26px;
      padding: 30px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      margin-bottom: 24px;
    }

    .section-title {
      margin: 0;

      font-size: 14px;
      font-weight: 950;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .section-title::before {
      content: "+";
      display: inline-block;

      margin-right: 10px;

      color: var(--pink);
      font-size: 18px;
    }

    .section-number {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #555;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap.full {
      grid-column: 1 / -1;
    }

    .input-label {
      position: absolute;
      left: 16px;
      top: 11px;

      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;

      color: #656565;

      pointer-events: none;
    }

    input {
      width: 100%;
      height: 58px;

      padding: 22px 16px 7px;

      border: 1px solid #292929;
      border-radius: 10px;

      outline: none;

      color: var(--white);
      background: #080808;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    input::placeholder {
      color: #444;
    }

    input:focus {
      border-color: var(--cyan);

      background: #0b0b0b;

      box-shadow:
        0 0 0 2px rgba(64,224,208,0.08),
        0 0 25px rgba(64,224,208,0.08);
    }

    .form-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
      margin-top: 14px;
    }

    .hint {
      color: #555;
      font-size: 11px;
      line-height: 1.5;
    }

    .primary {
      position: relative;

      min-height: 54px;
      padding: 0 25px;

      border: 0;
      border-radius: 9px;

      cursor: pointer;

      color: #080808;
      background:
        linear-gradient(
          135deg,
          #ff7d80,
          var(--pink)
        );

      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      box-shadow:
        0 10px 35px rgba(255,105,109,0.18);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;
    }

    .primary:hover {
      transform: translateY(-2px) skewX(-2deg);

      filter: brightness(1.08);

      box-shadow:
        0 14px 45px rgba(255,105,109,0.28);
    }

    .primary:active {
      transform: translateY(0);
    }

    /* =========================
       SONG LIST
    ========================= */

    .list-card {
      padding: 26px 0 10px;
    }

    .list-top {
      padding: 0 26px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .list-title-wrap {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .list-title {
      margin: 0;

      font-size: 14px;
      font-weight: 950;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 12px rgba(64,224,208,0.8);
    }

    .sort {
      height: 38px;

      padding: 0 34px 0 12px;

      border: 1px solid #2b2b2b;
      border-radius: 8px;

      outline: none;

      color: #aaa;
      background:
        #090909;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
    }

    .sort:focus {
      border-color: var(--cyan);
    }

    .status {
      padding: 0 26px 14px;

      min-height: 18px;

      color: var(--cyan);

      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       SONG ROW
    ========================= */

    .song {
      position: relative;

      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;

      align-items: center;
      gap: 18px;

      min-height: 96px;

      padding: 15px 26px;

      border-top: 1px solid #1f1f1f;

      transition:
        background 0.2s ease,
        padding 0.2s ease;
    }

    .song:hover {
      background:
        linear-gradient(
          90deg,
          rgba(64,224,208,0.035),
          rgba(255,105,109,0.035)
        );

      padding-left: 30px;
    }

    .song::before {
      content: "";

      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;

      width: 2px;

      background:
        linear-gradient(
          to bottom,
          var(--cyan),
          var(--pink)
        );

      opacity: 0;

      transition: opacity 0.2s ease;
    }

    .song:hover::before {
      opacity: 1;
    }

    /* =========================
       VOTES
    ========================= */

    .votes {
      width: 50px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 2px;
    }

    .vote {
      width: 28px;
      height: 23px;

      padding: 0;

      border: 0;
      border-radius: 5px;

      color: #555;
      background: transparent;

      cursor: pointer;

      font-size: 13px;
      line-height: 1;

      transition:
        color 0.15s ease,
        background 0.15s ease;
    }

    .vote:hover {
      color: var(--cyan);
      background: rgba(64,224,208,0.07);
    }

    .vote:disabled {
      opacity: 0.4;
      cursor: wait;
    }

    .count {
      min-width: 38px;

      color: var(--cyan);

      text-align: center;

      font-size: 18px;
      font-weight: 950;
      line-height: 1.2;
    }

    /* =========================
       SONG INFO
    ========================= */

    .song-info {
      min-width: 0;
    }

    .song-title-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;

      margin-bottom: 5px;
    }

    .title {
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: var(--white);

      font-size: 17px;
      font-weight: 850;
      letter-spacing: -0.015em;
    }

    .artist {
      color: #707070;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .new {
      display: inline-flex;
      align-items: center;

      height: 20px;
      padding: 0 8px;

      border: 1px solid rgba(64,224,208,0.35);
      border-radius: 4px;

      color: var(--cyan);

      background: rgba(64,224,208,0.07);

      font-size: 8px;
      font-weight: 950;
      letter-spacing: 0.16em;
      text-transform: uppercase;

      box-shadow:
        0 0 15px rgba(64,224,208,0.06);
    }

    /* =========================
       LISTEN BUTTON
    ========================= */

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .listen {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 108px;
      height: 38px;

      padding: 0 13px;

      border: 1px solid #363636;
      border-radius: 7px;

      color: #aaa;
      background: #0a0a0a;

      text-decoration: none;

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;

      transition:
        color 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        transform 0.18s ease;
    }

    .listen:hover {
      color: var(--pink);

      border-color: var(--pink);

      background: rgba(255,105,109,0.05);

      transform: translateY(-1px);
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty {
      padding: 60px 25px;

      border-top: 1px solid #1f1f1f;

      color: #555;

      text-align: center;

      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 15px 20px 45px;

      text-align: center;

      color: #3e3e3e;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    footer span {
      color: var(--pink);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {
      header {
        width: min(100% - 22px, 1180px);
        padding-top: 17px;
      }

      .mini-mark {
        font-size: 10px;
      }

      .menu-mark {
        width: 38px;
        height: 38px;
      }

      .hero {
        width: calc(100% - 22px);
        padding: 45px 0 40px;
      }

      .logo {
        font-size: clamp(70px, 23vw, 125px);

        text-shadow:
          4px 4px 0 var(--cyan),
          8px 8px 0 rgba(255,105,109,0.85);
      }

      .logo span {
        text-shadow:
          4px 4px 0 var(--cyan),
          8px 8px 0 rgba(255,255,255,0.08);
      }

      .subtitle {
        font-size: 13px;
        line-height: 1.6;
      }

      main {
        width: calc(100% - 22px);
        margin-bottom: 50px;
      }

      .add-card {
        padding: 22px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .input-wrap.full {
        grid-column: auto;
      }

      .form-bottom {
        flex-direction: column;
        align-items: stretch;
      }

      .primary {
        width: 100%;
      }

      .hint {
        text-align: center;
      }

      .list-top {
        padding: 20px 18px;

        align-items: flex-start;
        flex-direction: column;
      }

      .sort {
        width: 100%;
      }

      .status {
        padding-left: 18px;
        padding-right: 18px;
      }

      .song {
        grid-template-columns: 44px minmax(0, 1fr);

        gap: 11px;

        padding: 17px 18px;
      }

      .song:hover {
        padding-left: 18px;
      }

      .actions {
        grid-column: 2;
        justify-content: flex-start;

        margin-top: 3px;
      }

      .listen {
        min-width: 105px;
      }

      .votes {
        width: 42px;
      }

      .title {
        font-size: 15px;
      }

      .artist {
        font-size: 11px;
      }
    }

    @media (max-width: 400px) {
      .hero {
        padding-top: 35px;
      }

      .eyebrow {
        font-size: 9px;
        letter-spacing: 0.3em;
      }

      .logo {
        font-size: 70px;
      }

      .add-card {
        padding: 18px;
      }

      .song {
        padding-left: 14px;
        padding-right: 14px;
      }

      .list-top {
        padding-left: 15px;
        padding-right: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       TOP
  ========================== -->

  <header>
    <div class="mini-mark">
      FLY<span>D</span> / BAND
    </div>

    <div class="menu-mark" aria-hidden="true"></div>
  </header>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <div class="eyebrow">
      MUSIC · TOGETHER
    </div>

    <h1 class="logo">
      FLY<span>D</span>
    </h1>

    <div class="hero-line"></div>

    <p class="subtitle">
      <strong>Songs vorschlagen.</strong>
      Gemeinsam abstimmen.
      Die nächste Setlist vorbereiten. 🎸
    </p>

  </section>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <!-- ADD SONG -->

    <section class="card add-card">

      <div class="section-heading">
        <h2 class="section-title">
          Song hinzufügen
        </h2>

        <div class="section-number">
          01 / FLYD
        </div>
      </div>


      <form id="songForm">

        <div class="form-grid">

          <div class="input-wrap">
            <label class="input-label" for="title">
              Song
            </label>

            <input
              id="title"
              type="text"
              placeholder="z. B. Mr. Brightside"
              autocomplete="off"
              required
            />
          </div>


          <div class="input-wrap">
            <label class="input-label" for="artist">
              Artist
            </label>

            <input
              id="artist"
              type="text"
              placeholder="z. B. The Killers"
              autocomplete="off"
              required
            />
          </div>


          <div class="input-wrap full">
            <label class="input-label" for="url">
              Link
            </label>

            <input
              id="url"
              type="url"
              placeholder="Spotify, YouTube oder anderer Link (optional)"
              autocomplete="off"
            />
          </div>

        </div>


        <div class="form-bottom">

          <div class="hint">
            Neue Songs landen automatisch ganz oben.
          </div>

          <button class="primary" type="submit">
            + Song hinzufügen
          </button>

        </div>

      </form>

    </section>


    <!-- SONG LIST -->

    <section class="card list-card">

      <div class="list-top">

        <div class="list-title-wrap">

          <div class="live-dot"></div>

          <h2 class="list-title">
            Songliste
          </h2>

        </div>


        <select id="sort" class="sort">

          <option value="new" selected>
            Neueste zuerst
          </option>

          <option value="votes">
            Nach Stimmen
          </option>

          <option value="title">
            Titel A–Z
          </option>

        </select>

      </div>


      <div id="status" class="status"></div>


      <div id="songs"></div>

    </section>

  </main>


  <footer>
    FLYD <span>·</span> Music. Together.
  </footer>



  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://likbfaaucgnxtelesftw.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF1c2UiLCJyZWYiOiJsaWtiZmFhdWNuZ3h0ZWxlc2Z0dyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg5ODA0NjIzLCJleHAiOjIxMDUzODA2MjN9.ATnzNZueP8sr57juyNI_xce_7gKwqhk8ukzXtXKFXZc";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    const form = document.getElementById("songForm");
    const songsElement = document.getElementById("songs");
    const statusElement = document.getElementById("status");
    const sortElement = document.getElementById("sort");

    let songs = [];


    /* =========================
       SECURITY
    ========================== */

    function escapeHTML(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character])
      );
    }


    /* =========================
       NEW SONG
    ========================== */

    function isNew(createdAt) {
      return (
        Date.now() -
        new Date(createdAt).getTime()
      ) < 7 * 24 * 60 * 60 * 1000;
    }


    /* =========================
       RENDER
    ========================== */

    function renderSongs() {

      let list = [...songs];


      /*
        STANDARD:
        Neue Songs zuerst.

        Wenn zwei Songs praktisch
        gleich neu sind, entscheidet
        die Stimmenzahl.
      */

      if (sortElement.value === "new") {

        list.sort((a, b) => {

          const dateDifference =
            new Date(b.created_at) -
            new Date(a.created_at);

          if (dateDifference !== 0) {
            return dateDifference;
          }

          return (b.votes || 0) - (a.votes || 0);
        });

      }


      else if (sortElement.value === "votes") {

        list.sort((a, b) => {

          const voteDifference =
            (b.votes || 0) -
            (a.votes || 0);

          if (voteDifference !== 0) {
            return voteDifference;
          }

          return (
            new Date(b.created_at) -
            new Date(a.created_at)
          );
        });

      }


      else if (sortElement.value === "title") {

        list.sort((a, b) =>
          a.title.localeCompare(
            b.title,
            "de"
          )
        );

      }


      /* EMPTY */

      if (list.length === 0) {

        songsElement.innerHTML = `
          <div class="empty">
            Noch keine Songs vorhanden 🎶
          </div>
        `;

        return;
      }


      /* SONGS */

      songsElement.innerHTML = list.map(song => `

        <div class="song">

          <div class="votes">

            <button
              class="vote"
              data-id="${escapeHTML(song.id)}"
              data-vote="1"
              title="Upvote"
            >
              ▲
            </button>

            <div class="count">
              ${song.votes || 0}
            </div>

            <button
              class="vote"
              data-id="${escapeHTML(song.id)}"
              data-vote="-1"
              title="Downvote"
            >
              ▼
            </button>

          </div>


          <div class="song-info">

            <div class="song-title-line">

              <div class="title">
                ${escapeHTML(song.title)}
              </div>

              ${
                isNew(song.created_at)
                  ? `<span class="new">Neu</span>`
                  : ""
              }

            </div>


            <div class="artist">
              ${escapeHTML(song.artist)}
            </div>

          </div>


          <div class="actions">

            ${
              song.url
                ? `
                  <a
                    class="listen"
                    href="${escapeHTML(song.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ▶ Anhören
                  </a>
                `
                : ""
            }

          </div>

        </div>

      `).join("");
    }


    /* =========================
       LOAD SONGS
    ========================== */

    async function loadSongs() {

      const {
        data,
        error
      } = await db
        .from("songs")
        .select(
          "id,title,artist,url,votes,created_at"
        );


      if (error) {

        console.error(error);

        statusElement.textContent =
          "❌ " +
          error.message +
          " (" +
          error.code +
          ")";

        return;
      }


      songs = data || [];

      statusElement.textContent = "";

      renderSongs();
    }


    /* =========================
       ADD SONG
    ========================== */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const title =
          document
            .getElementById("title")
            .value
            .trim();

        const artist =
          document
            .getElementById("artist")
            .value
            .trim();

        const url =
          document
            .getElementById("url")
            .value
            .trim();


        if (!title || !artist) {
          return;
        }


        statusElement.textContent =
          "Song wird hinzugefügt…";


        const {
          error
        } = await db
          .from("songs")
          .insert({
            title: title,
            artist: artist,
            url: url || null,
            votes: 0
          });


        if (error) {

          console.error(error);

          statusElement.textContent =
            "❌ Song konnte nicht hinzugefügt werden.";

          return;
        }


        form.reset();

        statusElement.textContent =
          "✅ Song hinzugefügt!";


        await loadSongs();


        setTimeout(() => {

          statusElement.textContent = "";

        }, 2000);

      }
    );


    /* =========================
       VOTING
    ========================== */

    songsElement.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest("[data-vote]");


        if (!button) {
          return;
        }


        const id =
          button.dataset.id;

        const change =
          Number(button.dataset.vote);


        const song =
          songs.find(
            item => item.id === id
          );


        if (!song) {
          return;
        }


        button.disabled = true;


        const newVotes =
          Math.max(
            0,
            (song.votes || 0) + change
          );


        const {
          error
        } = await db
          .from("songs")
          .update({
            votes: newVotes
          })
          .eq("id", id);


        button.disabled = false;


        if (error) {

          console.error(error);

          statusElement.textContent =
            "❌ Abstimmung fehlgeschlagen.";

          return;
        }


        await loadSongs();

      }
    );


    /* =========================
       SORT
    ========================== */

    sortElement.addEventListener(
      "change",
      renderSongs
    );


    /* =========================
       REALTIME
    ========================== */

    db
      .channel("songs-live")

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "songs"
        },

        () => loadSongs()
      )

      .subscribe();


    /* =========================
       START
    ========================== */

    loadSongs();

  </script>

</body>
</html>
