<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BandSong – Song Voting</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#18202a;--muted:#6d7785;--line:#e3e8ef;--accent:#635bff;--good:#0f9d72;--bad:#d9485f}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:980px;margin:auto;padding:34px 18px 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}
    h1{margin:0;font-size:clamp(30px,5vw,46px);letter-spacing:-1.5px}.sub{color:var(--muted);margin:8px 0 0}
    .badge{background:#eceaff;color:#4e46d9;border-radius:999px;padding:8px 12px;font-weight:700;white-space:nowrap}
    .panel,.song{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px #16203308}
    .panel{padding:18px;margin-bottom:24px}.form{display:grid;grid-template-columns:1.2fr 1fr 1.5fr auto;gap:10px}
    input,button,select{font:inherit} input,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text)}
    button{border:0;border-radius:11px;padding:12px 15px;font-weight:750;cursor:pointer}.add{background:var(--accent);color:white}.filters{display:flex;gap:10px;align-items:center;margin:16px 0}
    .count{margin-left:auto;color:var(--muted);font-size:14px}.list{display:grid;gap:12px}.song{display:grid;grid-template-columns:72px 1fr auto;gap:15px;padding:16px;align-items:center}
    .score{display:flex;flex-direction:column;align-items:center;gap:4px}.vote{width:40px;padding:7px;border:1px solid var(--line);background:#fff}.vote:hover{background:#f0f1ff}.score b{font-size:20px}
    .title{font-size:18px;font-weight:800}.artist{color:var(--muted);margin-top:2px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}.new{color:var(--good);font-weight:750}
    .actions{display:flex;gap:8px}.listen{background:#eef0ff;color:#4e46d9}.delete{background:#fff0f2;color:var(--bad)} a{text-decoration:none}
    .empty{text-align:center;color:var(--muted);padding:38px}.tip{font-size:13px;color:var(--muted);margin-top:10px}
    @media(max-width:760px){.hero{align-items:start;flex-direction:column}.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}.form .add{grid-column:1/-1}.song{grid-template-columns:58px 1fr}.actions{grid-column:2}.count{margin-left:0}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><h1>🎸 BandSong</h1><p class="sub">Songvorschläge sammeln, anhören und gemeinsam voten.</p></div>
    <div class="badge" id="total">0 Songs</div>
  </div>

  <section class="panel">
    <form id="form" class="form">
      <input id="title" placeholder="Songtitel" required>
      <input id="artist" placeholder="Interpret" required>
      <input id="url" class="wide" type="url" placeholder="Spotify- oder YouTube-Link" required>
      <button class="add" type="submit">+ Song hinzufügen</button>
    </form>
    <div class="tip">Die Daten werden in diesem Browser gespeichert. Für eine echte gemeinsame Liste über mehrere Geräte braucht ihr noch eine Online-Datenbank.</div>
  </section>

  <div class="filters">
    <select id="sort">
      <option value="votes">Meiste Stimmen</option>
      <option value="new">Neueste zuerst</option>
      <option value="title">Titel A–Z</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <main id="list" class="list"></main>
</div>

<script>
const KEY="bandsong-v1";
let songs=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(songs)); render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){
  const mode=$("sort").value;
  let arr=[...songs];
  if(mode==="votes") arr.sort((a,b)=>(b.votes||0)-(a.votes||0)||b.created-a.created);
  if(mode==="new") arr.sort((a,b)=>b.created-a.created);
  if(mode==="title") arr.sort((a,b)=>(a.title+" "+a.artist).localeCompare(b.title+" "+b.artist,"de"));
  $("total").textContent=`${songs.length} ${songs.length===1?"Song":"Songs"}`;
  $("count").textContent=songs.length?`${songs.length} Vorschläge`:"Noch keine Vorschläge";
  $("list").innerHTML=arr.length?arr.map(s=>{
    const fresh=Date.now()-s.created<7*24*60*60*1000;
    return `<article class="song">
      <div class="score">
        <button class="vote" title="Hochvoten" onclick="vote('${s.id}',1)">▲</button>
        <b>${s.votes||0}</b>
        <button class="vote" title="Runtervoten" onclick="vote('${s.id}',-1)">▼</button>
      </div>
      <div>
        <div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div>
        <div class="meta"><span>${new Date(s.created).toLocaleDateString("de-DE")}</span>${fresh?'<span class="new">• Neu</span>':''}</div>
      </div>
      <div class="actions">
        <a class="listen button" href="${esc(s.url)}" target="_blank" rel="noopener">▶ Anhören</a>
        <button class="delete" onclick="removeSong('${s.id}')">Löschen</button>
      </div>
    </article>`
  }).join(""):`<div class="panel empty">Noch keine Songs. Fügt den ersten Vorschlag hinzu! 🎶</div>`;
}
function vote(id,n){const s=songs.find(x=>x.id===id);if(s){s.votes=(s.votes||0)+n;save()}}
function removeSong(id){if(confirm("Song wirklich löschen?")){songs=songs.filter(s=>s.id!==id);save()}}
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const title=$("title").value.trim(),artist=$("artist").value.trim(),url=$("url").value.trim();
  if(!title||!artist||!url)return;
  songs.push({id:crypto.randomUUID(),title,artist,url,votes:0,created:Date.now()});
  e.target.reset();save();
});
$("sort").addEventListener("change",render);render();
</script>
</body>
</html>
