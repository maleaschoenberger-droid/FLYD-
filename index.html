<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FLYD · Songliste</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #030607;
      --black-2: #070b0d;
      --card: rgba(7, 13, 16, 0.94);
      --white: #f5f7f7;
      --muted: #8d9ba1;
      --cyan: #40e0d0;
      --pink: #ff2d73;
      --pink-light: #ff527f;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      color: var(--white);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 4% 12%,
          rgba(64, 224, 208, 0.18),
          transparent 23%
        ),
        radial-gradient(
          circle at 96% 13%,
          rgba(255, 45, 115, 0.18),
          transparent 23%
        ),
        radial-gradient(
          circle at 5% 94%,
          rgba(64, 224, 208, 0.11),
          transparent 21%
        ),
        radial-gradient(
          circle at 96% 94%,
          rgba(255, 45, 115, 0.10),
          transparent 21%
        ),
        #030607;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          115deg,
          transparent 0 48%,
          rgba(64, 224, 208, 0.015) 49%,
          transparent 50%
        );

      opacity: 0.7;
    }

    .page {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: relative;
      padding: 5px 0 28px;
      text-align: center;
    }

    .menu {
      position: absolute;
      top: 7px;
      right: 2px;

      color: var(--cyan);
      font-size: 26px;

      text-shadow:
        0 0 10px rgba(64, 224, 208, 0.7),
        0 0 25px rgba(64, 224, 208, 0.25);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;

      width: 100%;
      margin: 0 auto 8px;
    }

    .flyd-logo {
      display: block;

      width: min(650px, 88vw);
      height: auto;

      object-fit: contain;

      filter:
        drop-shadow(0 0 10px rgba(64, 224, 208, 0.18))
        drop-shadow(0 0 18px rgba(255, 45, 115, 0.14));
    }

    .subtitle {
      max-width: 800px;
      margin: 5px auto 0;
      padding: 0 12px;

      color: #dfe5e6;

      font-size: 17px;
      line-height: 1.5;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      position: relative;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(12, 20, 23, 0.97),
          rgba(4, 9, 11, 0.97)
        );

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;

      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(64, 224, 208, 0.06),
          transparent 25%,
          transparent 75%,
          rgba(255, 45, 115, 0.06)
        );
    }

    /* =========================
       ADD SONG
    ========================= */

    .add-card {
      margin-bottom: 24px;
      padding: 25px 30px 27px;

      border-color: rgba(64, 224, 208, 0.36);

      box-shadow:
        0 0 35px rgba(64, 224, 208, 0.06),
        0 0 35px rgba(255, 45, 115, 0.035),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .add-card::after {
      content: "";

      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          transparent 50%,
          var(--pink),
          transparent
        );

      opacity: 0.6;
    }

    .section-title {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;

      font-size: 17px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .plus {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 38px;
      height: 38px;

      border: 1px solid rgba(64, 224, 208, 0.25);
      border-radius: 50%;

      color: white;
      background: rgba(64, 224, 208, 0.08);

      font-size: 27px;
      font-weight: 300;

      box-shadow:
        0 0 18px rgba(64, 224, 208, 0.10);
    }

    .section-title::after {
      content: "";

      width: 3px;
      height: 22px;

      background: var(--cyan);

      box-shadow:
        0 0 10px rgba(64, 224, 208, 0.8);
    }

    .form-grid {
      position: relative;
      z-index: 1;

      display: grid;
      grid-template-columns: 1fr 1fr 1.12fr auto;

      gap: 14px;
      align-items: center;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 15px;

      transform: translateY(-50%);

      color: var(--cyan);
      font-size: 18px;

      pointer-events: none;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 15px 0 45px;

      outline: none;

      border: 1px solid rgba(100, 145, 155, 0.52);
      border-radius: 9px;

      color: white;
      background: rgba(2, 7, 9, 0.9);

      font-size: 14px;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    input::placeholder {
      color: #87959b;
    }

    input:focus {
      border-color: var(--cyan);

      background: rgba(5, 12, 14, 0.98);

      box-shadow:
        0 0 0 2px rgba(64, 224, 208, 0.08),
        0 0 18px rgba(64, 224, 208, 0.08);
    }

    .add-button {
      height: 48px;

      padding: 0 22px;

      border: 0;
      border-radius: 999px;

      color: #18050c;

      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--pink-light)
        );

      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;

      cursor: pointer;

      box-shadow:
        0 0 20px rgba(255, 45, 115, 0.25);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .add-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 28px rgba(255, 45, 115, 0.42);
    }

    .add-button:active {
      transform: translateY(0);
    }

    .add-button:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    #status {
      min-height: 20px;
      margin-top: 11px;

      color: var(--cyan);

      font-size: 13px;
      text-align: center;
    }

    /* =========================
       SONG LIST
    ========================= */

    .list-card {
      margin-bottom: 20px;
      padding: 20px 0 5px;
    }

    .list-header {
      position: relative;
      z-index: 2;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0 30px 16px;

      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .list-title {
      display: flex;
      align-items: center;
      gap: 14px;

      font-size: 17px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .music-icon {
      color: var(--pink);
      font-size: 30px;

      filter:
        drop-shadow(0 0 7px rgba(255, 45, 115, 0.5));
    }

    select {
      min-width: 205px;
      height: 42px;

      padding: 0 38px 0 17px;

      outline: none;

      border: 1px solid var(--cyan);
      border-radius: 999px;

      color: white;
      background: #071013;

      font-size: 13px;

      cursor: pointer;
    }

    select:focus {
      box-shadow:
        0 0 0 2px rgba(64, 224, 208, 0.09);
    }

    /* =========================
       SONG
    ========================= */

    .song {
      position: relative;
      z-index: 1;

      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 140px;

      align-items: center;

      min-height: 76px;

      padding: 9px 30px;

      border-bottom: 1px solid rgba(255, 255, 255, 0.075);

      transition: background 0.15s ease;
    }

    .song:last-child {
      border-bottom: 0;
    }

    .song:hover {
      background:
        linear-gradient(
          90deg,
          rgba(64, 224, 208, 0.045),
          rgba(255, 45, 115, 0.035)
        );
    }

    .vote-area {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .vote-buttons {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .vote {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 44px;
      height: 25px;

      padding: 0;

      border: 1px solid rgba(64, 224, 208, 0.75);
      border-radius: 999px;

      color: white;
      background: transparent;

      font-size: 12px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.15s ease;
    }

    .vote:hover {
      color: var(--cyan);
      background: rgba(64, 224, 208, 0.13);

      box-shadow:
        0 0 12px rgba(64, 224, 208, 0.16);
    }

    .vote:active {
      transform: scale(0.94);
    }

    .vote:disabled {
      opacity: 0.45;
      cursor: wait;
    }

    .vote.my-up {
      color: #030607;
      background: var(--cyan);
      border-color: var(--cyan);

      box-shadow:
        0 0 14px rgba(64, 224, 208, 0.35);
    }

    .vote.my-down {
      color: white;
      background: var(--pink);
      border-color: var(--pink);

      box-shadow:
        0 0 14px rgba(255, 45, 115, 0.35);
    }

    .count {
      min-width: 34px;

      color: var(--cyan);

      font-size: 21px;
      font-weight: 500;

      text-align: center;

      text-shadow:
        0 0 10px rgba(64, 224, 208, 0.22);

      transition:
        color 0.15s ease,
        text-shadow 0.15s ease;
    }

    .count.negative {
      color: var(--pink);

      text-shadow:
        0 0 10px rgba(255, 45, 115, 0.25);
    }

    .song-info {
      min-width: 0;
    }

    .song-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;

      color: #f4f6f6;

      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .artist {
      margin-top: 3px;

      color: #91a0a6;

      font-size: 13px;
      line-height: 1.3;
    }

    .new {
      display: inline-flex;
      align-items: center;

      height: 22px;

      padding: 0 8px;

      border: 1px solid var(--cyan);
      border-radius: 999px;

      color: var(--cyan);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;

      box-shadow:
        0 0 9px rgba(64, 224, 208, 0.08);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    .listen {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      min-width: 126px;
      height: 38px;

      padding: 0 16px;

      border: 1px solid var(--pink);
      border-radius: 999px;

      color: white;
      background: transparent;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;

      transition:
        background 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.15s ease;
    }

    .listen:hover {
      background: rgba(255, 45, 115, 0.11);

      box-shadow:
        0 0 18px rgba(255, 45, 115, 0.16);

      transform: translateY(-1px);
    }

    .empty {
      padding: 50px 20px;

      color: #849196;

      font-size: 15px;
      text-align: center;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 22px 0 4px;

      color: #a3adb1;

      font-size: 12px;
      letter-spacing: 1.4px;

      text-align: center;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-grid .input-wrap:nth-child(3) {
        grid-column: 1 / -1;
      }

      .add-button {
        width: 100%;
      }

      .song {
        grid-template-columns: 140px minmax(0, 1fr) 125px;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .page {
        width: min(100% - 20px, 600px);
        padding-top: 18px;
      }

      header {
        padding-bottom: 20px;
      }

      .menu {
        top: 0;
        right: 2px;

        font-size: 23px;
      }

      .flyd-logo {
        width: min(500px, 92vw);
      }

      .subtitle {
        font-size: 14px;
        line-height: 1.45;
      }

      .add-card {
        padding: 20px 16px 21px;
        border-radius: 15px;
      }

      .section-title {
        margin-bottom: 16px;
        font-size: 14px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .form-grid .input-wrap:nth-child(3) {
        grid-column: auto;
      }

      input,
      .add-button {
        height: 47px;
      }

      .list-card {
        border-radius: 15px;
      }

      .list-header {
        flex-direction: column;
        align-items: stretch;

        gap: 12px;

        padding: 14px 16px;
      }

      .list-title {
        font-size: 14px;
      }

      select {
        width: 100%;
      }

      .song {
        grid-template-columns: 91px minmax(0, 1fr);

        gap: 10px;

        min-height: 82px;

        padding: 12px 13px;
      }

      .vote-area {
        gap: 7px;
      }

      .vote {
        width: 35px;
        height: 24px;
      }

      .count {
        min-width: 25px;
        font-size: 18px;
      }

      .song-title {
        font-size: 14px;
      }

      .artist {
        font-size: 12px;
      }

      .actions {
        grid-column: 2;

        justify-content: flex-start;

        margin-top: 2px;
      }

      .listen {
        min-width: 112px;
        height: 34px;

        font-size: 12px;
      }

      footer {
        padding-bottom: 10px;
      }
    }

    @media (max-width: 390px) {

      .page {
        width: calc(100% - 14px);
      }

      .song {
        grid-template-columns: 83px minmax(0, 1fr);

        padding-left: 8px;
        padding-right: 8px;
      }

      .vote {
        width: 31px;
      }

      .count {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>

      <div class="menu" aria-hidden="true">
        ☰
      </div>

      <div class="logo-wrap">

        <img
          class="flyd-logo"
          src="flyd-logo.PNG"
          alt="FLYD"
        >

      </div>

      <div class="subtitle">
        Songs vorschlagen, gemeinsam abstimmen und die nächste Setlist vorbereiten. 🎸
      </div>

    </header>


    <section class="card add-card">

      <div class="section-title">

        <span class="plus">
          +
        </span>

        <span>
          Song hinzufügen
        </span>

      </div>


      <form id="songForm">

        <div class="form-grid">

          <div class="input-wrap">

            <span class="input-icon">
              ♫
            </span>

            <input
              id="title"
              type="text"
              maxlength="120"
              placeholder="Songtitel"
              required
            >

          </div>


          <div class="input-wrap">

            <span class="input-icon">
              ♙
            </span>

            <input
              id="artist"
              type="text"
              maxlength="120"
              placeholder="Interpret / Band"
              required
            >

          </div>


          <div class="input-wrap">

            <span class="input-icon">
              ↗
            </span>

            <input
              id="url"
              type="url"
              placeholder="Spotify- oder YouTube-Link (optional)"
            >

          </div>


          <button
            class="add-button"
            id="addButton"
            type="submit"
          >
            ＋ &nbsp; Song hinzufügen
          </button>

        </div>

      </form>


      <div id="status"></div>

    </section>


    <section class="card list-card">

      <div class="list-header">

        <div class="list-title">

          <span class="music-icon">
            ♫
          </span>

          <span>
            Songliste
          </span>

        </div>


        <select id="sort">

          <option value="new">
            Neueste zuerst
          </option>

          <option value="votes">
            Nach Stimmen
          </option>

          <option value="title">
            Nach Titel
          </option>

        </select>

      </div>


      <div id="songs">

        <div class="empty">
          Songs werden geladen …
        </div>

      </div>

    </section>


    <footer>
      FLYD · Music. Together.
    </footer>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /*
    ============================================================
    SUPABASE
    ============================================================
    */

    const SUPABASE_URL =
      "https://likbfaaucgnxtelesftw.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxpa2JmYWF1Y2dueHRlbGVzZnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MDQ2MjMsImV4cCI6MjEwNTM4MDYyM30.ATnzNZueP8sr57juyNIx_ce_7gKwqhk8ukzXtXKFXZc";


    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
    ============================================================
    ELEMENTE
    ============================================================
    */

    const form =
      document.getElementById("songForm");

    const songsElement =
      document.getElementById("songs");

    const statusElement =
      document.getElementById("status");

    const sortElement =
      document.getElementById("sort");

    const addButton =
      document.getElementById("addButton");


    let songs = [];

    let votes = [];


    /*
    ============================================================
    BROWSER-ID
    ============================================================
    */

    function getVoterId() {

      const storageKey =
        "flyd-voter-id";

      let voterId =
        localStorage.getItem(storageKey);


      if (!voterId) {

        voterId =
          crypto.randomUUID();

        localStorage.setItem(
          storageKey,
          voterId
        );

      }


      return voterId;

    }


    const voterId =
      getVoterId();


    /*
    ============================================================
    HTML SICHER AUSGEBEN
    ============================================================
    */

    function escapeHTML(value) {

      return String(value ?? "").replace(
        /[&<>"']/g,

        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character])
      );

    }


    /*
    ============================================================
    NEUER SONG?
    ============================================================
    */

    function isNew(createdAt) {

      const created =
        new Date(createdAt).getTime();

      const sevenDays =
        7 * 24 * 60 * 60 * 1000;

      return (
        Date.now() - created <
        sevenDays
      );

    }


    /*
    ============================================================
    VOTE-DATEN
    ============================================================

    score:

      👍 = +1
      👎 = -1

    Beispiel:

      👍 👍 👍 👎

      = 3 - 1
      = 2
    */

    function getVoteInfo(songId) {

      const songVotes =
        votes.filter(
          vote =>
            vote.song_id === songId
        );


      const score =
        songVotes.reduce(
          (sum, vote) =>
            sum + Number(vote.vote),
          0
        );


      const myVote =
        songVotes.find(
          vote =>
            vote.voter_id === voterId
        );


      return {

        score:
          score,

        mine:
          myVote
            ? Number(myVote.vote)
            : 0

      };

    }


    /*
    ============================================================
    SORTIERUNG
    ============================================================
    */

    function getSortedSongs() {

      const list =
        [...songs];


      if (sortElement.value === "new") {

        list.sort((a, b) => {

          return (
            new Date(b.created_at) -
            new Date(a.created_at)
          );

        });

      }


      else if (
        sortElement.value === "votes"
      ) {

        list.sort((a, b) => {

          const aScore =
            getVoteInfo(a.id).score;

          const bScore =
            getVoteInfo(b.id).score;


          if (bScore !== aScore) {

            return bScore - aScore;

          }


          return (
            new Date(b.created_at) -
            new Date(a.created_at)
          );

        });

      }


      else if (
        sortElement.value === "title"
      ) {

        list.sort((a, b) => {

          return String(
            a.title || ""
          ).localeCompare(
            String(
              b.title || ""
            ),
            "de"
          );

        });

      }


      return list;

    }


    /*
    ============================================================
    SONGS RENDERN
    ============================================================
    */

    function renderSongs() {

      const list =
        getSortedSongs();


      if (list.length === 0) {

        songsElement.innerHTML = `
          <div class="empty">
            Noch keine Songs vorhanden 🎶
          </div>
        `;

        return;

      }


      songsElement.innerHTML =
        list.map(song => {

          const id =
            escapeHTML(song.id);

          const title =
            escapeHTML(song.title);

          const artist =
            escapeHTML(song.artist);

          const url =
            escapeHTML(song.url);


          const voteInfo =
            getVoteInfo(song.id);


          const score =
            voteInfo.score;


          const myVote =
            voteInfo.mine;


          const upClass =
            myVote === 1
              ? "my-up"
              : "";


          const downClass =
            myVote === -1
              ? "my-down"
              : "";


          const scoreClass =
            score < 0
              ? "negative"
              : "";


          const newBadge =
            isNew(song.created_at)
              ? `<span class="new">NEU</span>`
              : "";


          const listen =
            song.url
              ? `
                <a
                  class="listen"
                  href="${url}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ▶ &nbsp; Anhören
                </a>
              `
              : "";


          return `

            <div class="song">

              <div class="vote-area">

                <div class="vote-buttons">

                  <button
                    class="vote ${upClass}"
                    type="button"
                    data-id="${id}"
                    data-vote="1"
                    aria-label="Song hochvoten"
                    title="Dafür stimmen"
                  >
                    ▲
                  </button>

                  <button
                    class="vote ${downClass}"
                    type="button"
                    data-id="${id}"
                    data-vote="-1"
                    aria-label="Song runtervoten"
                    title="Dagegen stimmen"
                  >
                    ▼
                  </button>

                </div>

                <div>

                  <div class="count ${scoreClass}">
                    ${score}
                  </div>

                </div>

              </div>


              <div class="song-info">

                <div class="song-title">

                  ${title}

                  ${newBadge}

                </div>

                <div class="artist">
                  ${artist}
                </div>

              </div>


              <div class="actions">

                ${listen}

              </div>

            </div>

          `;

        }).join("");

    }


    /*
    ============================================================
    SONGS LADEN
    ============================================================
    */

    async function loadSongs() {

      const {
        data,
        error
      } = await db
        .from("songs")
        .select(
          "id,title,artist,url,created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(
          "Songs Supabase Fehler:",
          error
        );

        statusElement.textContent =
          "❌ " +
          error.message +
          " (" +
          error.code +
          ")";

        return;

      }


      songs =
        data || [];


      await loadVotes();

    }


    /*
    ============================================================
    VOTES LADEN
    ============================================================
    */

    async function loadVotes() {

      const {
        data,
        error
      } = await db
        .from("song_votes")
        .select(
          "song_id,voter_id,vote"
        );


      if (error) {

        console.error(
          "Votes Supabase Fehler:",
          error
        );

        statusElement.textContent =
          "❌ Stimmen konnten nicht geladen werden.";

        return;

      }


      votes =
        data || [];


      statusElement.textContent =
        "";


      renderSongs();

    }


    /*
    ============================================================
    SONG HINZUFÜGEN
    ============================================================
    */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const title =
          document
            .getElementById("title")
            .value
            .trim();


        const artist =
          document
            .getElementById("artist")
            .value
            .trim();


        const url =
          document
            .getElementById("url")
            .value
            .trim();


        if (
          !title ||
          !artist
        ) {

          statusElement.textContent =
            "Bitte Songtitel und Interpret eingeben.";

          return;

        }


        addButton.disabled =
          true;

        statusElement.textContent =
          "Song wird hinzugefügt …";


        const {
          error
        } = await db
          .from("songs")
          .insert({

            title:
              title,

            artist:
              artist,

            url:
              url || null

          });


        addButton.disabled =
          false;


        if (error) {

          console.error(
            "Insert Fehler:",
            error
          );

          statusElement.textContent =
            "❌ Song konnte nicht hinzugefügt werden.";

          return;

        }


        form.reset();


        statusElement.textContent =
          "✅ Song hinzugefügt!";


        await loadSongs();


        setTimeout(() => {

          statusElement.textContent =
            "";

        }, 2000);

      }
    );


    /*
    ============================================================
    VOTING
    ============================================================

    Verhalten:

      Noch keine Stimme
        ▲ → +1
        ▼ → -1

      Schon 👍
        ▲ → Stimme entfernen
        ▼ → auf 👎 wechseln

      Schon 👎
        ▼ → Stimme entfernen
        ▲ → auf 👍 wechseln
    */

    songsElement.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest(
            "[data-vote]"
          );


        if (!button) {
          return;
        }


        const songId =
          button.dataset.id;


        const newVote =
          Number(
            button.dataset.vote
          );


        if (
          newVote !== 1 &&
          newVote !== -1
        ) {
          return;
        }


        /*
          Aktuelle eigene Stimme herausfinden.
        */

        const currentVote =
          getVoteInfo(songId).mine;


        button.disabled =
          true;


        statusElement.textContent =
          "Stimme wird gespeichert …";


        let error = null;


        /*
        --------------------------------------------------------
        GLEICHEN BUTTON NOCHMAL
        --------------------------------------------------------

        Beispiel:

        Ich habe 👍

        Ich klicke nochmal 👍

        → Stimme wird komplett gelöscht.
        */

        if (
          currentVote === newVote
        ) {

          const result =
            await db
              .from("song_votes")
              .delete()
              .eq(
                "song_id",
                songId
              )
              .eq(
                "voter_id",
                voterId
              );


          error =
            result.error;

        }


        /*
        --------------------------------------------------------
        NEUE STIMME ODER WECHSEL
        --------------------------------------------------------

        Noch keine Stimme:

          0 → +1
          0 → -1

        Wechsel:

          +1 → -1 = -2
          -1 → +1 = +2
        */

        else {

          const result =
            await db
              .from("song_votes")
              .upsert(

                {
                  song_id:
                    songId,

                  voter_id:
                    voterId,

                  vote:
                    newVote

                },

                {
                  onConflict:
                    "song_id,voter_id"
                }

              );


          error =
            result.error;

        }


        button.disabled =
          false;


        if (error) {

          console.error(
            "Vote Fehler:",
            error
          );

          statusElement.textContent =
            "❌ Abstimmung fehlgeschlagen.";

          return;

        }


        /*
          Danach die aktuellen Daten neu laden.
          Dadurch sehen auch Score und Markierung
          sofort richtig aus.
        */

        await loadVotes();


        setTimeout(() => {

          statusElement.textContent =
            "";

        }, 800);

      }
    );


    /*
    ============================================================
    SORTIERUNG
    ============================================================
    */

    sortElement.addEventListener(
      "change",
      renderSongs
    );


    /*
    ============================================================
    REALTIME
    ============================================================
    */

    db
      .channel("songs-live")

      .on(
        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "songs"
        },

        () => {

          loadSongs();

        }

      )

      .on(
        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "song_votes"
        },

        () => {

          loadVotes();

        }

      )

      .subscribe();


    /*
    ============================================================
    START
    ============================================================
    */

    loadSongs();

  </script>

</body>
</html>
